aw9523b:
  - id: aw9523b_hub
    i2c_id: i2c_bus
    p0_drive_mode: PUSH_PULL
    led_max_current: 27.75mA
  - id: aw9523b_hub_int
    i2c_id: i2c_bus
    interrupt_pin: ${interrupt_pin}

binary_sensor:
  - platform: gpio
    id: aw9523b_input_p0
    name: AW9523B input P0
    pin:
      aw9523b_id: aw9523b_hub
      number: 3
  - platform: gpio
    id: aw9523b_input_p1
    name: AW9523B input P1
    pin:
      aw9523b_id: aw9523b_hub_int
      number: 11

switch:
  - platform: gpio
    id: aw9523b_output_pin
    name: AW9523B output pin
    pin:
      aw9523b_id: aw9523b_hub
      number: 4
      mode: OUTPUT

output:
  - platform: aw9523b
    id: aw9523b_led
    aw9523b_id: aw9523b_hub
    pin: 0
